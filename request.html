    '<div class="card" id="cI"><h2>2 · รายการสินค้าที่' + w + ' <small class="hint">(' + S.rows.length + ' รายการ · วันเดียวกัน)</small></h2><div class="itlist">' +
    (true ? S.rows.map(function (r, i) { return rowHtml(L, r, i); }).join('') + '<button type="button" class="sec add" id="bAdd">+ เพิ่มสินค้า (รายการที่ ' + (S.rows.length + 1) + ')</button>' +
      '<div class="hint" style="margin-top:6px">' + (S.t === 'in' ? 'ถ้าสินค้าที่รับเข้ายังไม่มีในรายการ เลือก "+ สินค้าใหม่" ท้ายรายการค้นหา แล้วกรอกข้อมูลสินค้า (เหมือนหน้า Master Item) ระบบจะเพิ่มเป็นสินค้าใหม่ให้เมื่อเจ้าหน้าที่อนุมัติ' : 'ถ้าสินค้าที่จะเบิกไม่มีในรายการ เลือก "+ สินค้าอื่น" ท้ายรายการค้นหา แล้วกรอกข้อมูลสินค้า เจ้าหน้าที่จะตรวจและเพิ่มสินค้านี้เข้าระบบ (ยังไม่ตัด Stock เพราะยังไม่มีในคลัง)') + '</div>'
      : '<span class="hint">ยังไม่มีรายการสินค้าของ ' + S.kind.toUpperCase() + ' ในคลัง ' + S.src + '</span>') +
    '</div><label>รายละเอียด / หมายเหตุ</label><textarea id="fN" rows="2">' + esc(S.note) + '</textarea></div>' +
    '<div class="card" id="cU"><h2>3 · ข้อมูลผู้' + w + '</h2><label>ชื่อ - นามสกุล <span class="req">*</span></label><input id="fName" autocomplete="name" value="' + esc(S.name) + '">' +
    '<label>หน่วยงาน <span class="req">*</span></label><input id="fDept" value="' + esc(S.dept) + '"><label>เบอร์โทร</label><input id="fTel" inputmode="tel" value="' + esc(S.tel) + '"></div>' +
    '<div class="card" id="cP"><h2>4 · รูปภาพ <small class="hint">(ไม่บังคับ)</small></h2><div class="btns"><button type="button" id="bCam">ถ่ายรูป</button><button type="button" class="sec" id="bPic">เลือกรูป</button></div>' +
    '<input type="file" id="f1" accept="image/*" capture="environment" hidden><input type="file" id="f2" accept="image/*" hidden>' +
    '<div class="ph">' + (S.photo ? '<img src="' + S.photo.thumb + '" alt=""><button type="button" class="sec" id="bPx">ลบรูป</button>' : '<span class="hint">ถ่ายรูปสินค้าที่' + w + ' หรือเอกสารประกอบ</span>') + '</div>' +
    '<h2 style="margin-top:16px">5 · สแกนเอกสาร / แนบไฟล์ PDF <small class="hint">(ไม่บังคับ)</small></h2><div class="hint">ใบส่งของ / ใบเบิก · ถ่ายรูปหรือเลือกไฟล์ PDF · ระบบแนบไฟล์ไปกับคำขอ และอ่านข้อความเพื่อกรอกรายการสินค้าให้</div>' +
    '<button type="button" class="sec" id="bScan" style="width:100%;margin-top:8px">' + (S.doc ? 'สแกน / เลือกไฟล์ใหม่' : 'สแกนเอกสาร / เลือกไฟล์ PDF') + '</button>' +
    (S.doc ? '<div class="ph">' + S.doc.thumbs.slice(0, 4).map(function (t) { return '<img src="' + t + '" alt="" style="width:70px;height:90px">'; }).join('') + '<button type="button" class="sec" id="bDx">ลบเอกสาร</button></div><div class="hint">✓ ' + (S.doc.file ? 'ไฟล์ ' + esc(S.doc.file) : 'เอกสาร ' + S.doc.thumbs.length + ' หน้า') + ' (PDF) แนบไปกับคำขอ' + (S.doc.n ? ' · จับคู่สินค้าได้ ' + S.doc.n + ' รายการ' : '') + (S.doc.err ? ' · อ่านข้อความไม่สำเร็จ: ' + esc(S.doc.err) : !S.doc.text ? ' · ไม่พบข้อความในเอกสาร' : '') + '</div>' +
      (S.doc.text ? '<details><summary class="hint">ข้อความที่อ่านได้</summary><textarea readonly rows="6" style="font-size:12px">' + esc(S.doc.text) + '</textarea></details>' : '') : '') + '</div>' +
    '<div id="cS"><button class="go" id="bGo">ส่งคำขอ' + w + (nOk ? ' (' + nOk + ' รายการ)' : '') + '</button>' +
    '<div class="card"><details><summary>ตรวจสถานะคำขอ</summary><label>เลขคำขอ</label><input id="fNo"><button type="button" class="sec" id="bChk" style="margin-top:8px">ตรวจสถานะ</button><div class="st" id="stOut"></div></details></div></div>';
  each('#sT button', function (b) { b.onclick = function () { keep(); S.t = b.dataset.v; draw(); }; });
  each('#sK button', function (b) { b.onclick = function () { keep(); if (S.kind !== b.dataset.v) S.rows = [blankRow()]; S.kind = b.dataset.v; draw(); }; });
  each('#sS button', function (b) { b.onclick = function () { keep(); if (S.src !== b.dataset.v) S.rows = [blankRow()]; S.src = b.dataset.v; draw(); }; });
  if ($('bAdd')) $('bAdd').onclick = function () { keep(); S.rows.push(blankRow()); draw(); var l = document.querySelectorAll('.itm'); if (l.length) l[l.length - 1].scrollIntoView({ block: 'center' }); };
  each('.fX', function (b) { b.onclick = function () { keep(); S.rows.splice(Number(b.dataset.i), 1); draw(); }; });

  each('.fE', function (b) { b.onclick = function () { newPop(Number(b.dataset.i), false); }; });
  each('.fCat', function (x) { x.onchange = function () { keep(); draw(); var t = document.querySelector('.fCatX[data-i="' + x.dataset.i + '"]'); if (t) t.focus(); }; });
  each('.fS', function (x) {
    var i = Number(x.dataset.i);
    x.addEventListener('input', function () {
      var r = S.rows[i]; r.f = x.value;
      // แก้ข้อความหลังเลือกแล้ว = ยกเลิกสินค้าที่เลือก (รอเลือกใหม่จากรายการ)
      if (r.id && r.id !== NEW) { var it = itemOf(r.id); if (!it || x.value !== label(it)) { r.id = ''; var p = document.querySelector('.pk[data-i="' + i + '"]'); if (p) p.innerHTML = 'พิมพ์แล้วเลือกสินค้าจากรายการที่ขึ้นมา'; var u = x.parentNode.querySelector('input.ro'); if (u) u.value = ''; } }
    });
    AC.bind(x, function (q) {
      var L = S.items.filter(inSrc);
      return AC.items(L, q, 30).map(function (y) { return { t: label(y), s: (catsOf(L).filter(function (c) { return c[0] === y.cat; })[0] || ['', y.cat])[1] + '', id: y.id }; })
        .concat([{ t: (S.t === 'in' ? '+ สินค้าใหม่ (ยังไม่มีในระบบ): ' : '+ สินค้าอื่น (ไม่มีในรายการ): ') + q, cls: 'acnew', nw: q }]);
    }, function (y) {
      keep(); var r = S.rows[i];
      if (y.nw != null) { r.n = null; r.sku = ''; r.name = ''; if (/^(\d{6,}|(IFS|ELG)-[A-Z]{3}-\d+)$/i.test(y.nw)) r.sku = y.nw.toUpperCase().slice(0, 40); else r.name = y.nw; newPop(i, true); return; }
      else { r.id = y.id; r.n = null; r.f = label(itemOf(y.id)); }
      draw();
      var n = document.querySelector(r.id === NEW ? (r.name ? '.fQ[data-i="' + i + '"]' : '.fNm[data-i="' + i + '"]') : '.fQ[data-i="' + i + '"]'); if (n) n.focus();
    });
  });
  each('.fSku', function (x) { x.addEventListener('input', function () { var v = x.value.toUpperCase().replace(/\s+/g, ''); if (v !== x.value) x.value = v; }); });
  var pick = async function (inp) {
    var f = inp.files[0]; inp.value = ''; if (!f) return; keep();
    if (!/^image\//.test(f.type)) { toast('ไฟล์ต้องเป็นรูปภาพ'); return; }
    try { busy(true, 'กำลังเตรียมรูป...'); var big = await shrink(f, 1280, 0.8), th = await shrink(f, 200, 0.6); S.photo = { mime: 'image/jpeg', b64: big.split(',')[1], thumb: th }; draw(); } catch (e) { toast(e.message); } finally { busy(false); }
  };
  $('bCam').onclick = function () { $('f1').click(); }; $('bPic').onclick = function () { $('f2').click(); };
  $('f1').onchange = function () { pick($('f1')); }; $('f2').onchange = function () { pick($('f2')); };
  if ($('bPx')) $('bPx').onclick = function () { keep(); S.photo = null; draw(); };
  if ($('bDx')) $('bDx').onclick = function () { keep(); S.doc = null; draw(); };
  $('bScan').onclick = async function () {
    keep();
    var r = await DocScan.open({ title: 'สแกนเอกสาร / ไฟล์ PDF', max: 5, pdfOk: true, okText: 'เสร็จ · อ่านข้อความ', hint: 'ถ่ายได้หลายหน้า หรือเลือกไฟล์ PDF · ระบบรวมเป็น PDF ไฟล์เดียวและอ่านข้อความให้', ocr: function (pages) { return api('ioPubOcr', [pages.slice(0, 2)]); } });
    if (!r) return;
    if (r.pdf && r.pdf.length * 0.75 > 12 * 1024 * 1024) { toast('ไฟล์ PDF ใหญ่เกิน 12MB · ลดขนาดไฟล์หรือสแกนน้อยหน้าลง'); return; }
    var L = S.items.filter(inSrc), m = DocScan.matchItems(r.text, L);
    // เติมรายการที่จับคู่ได้ (ไม่ซ้ำกับที่เลือกไว้แล้ว)
    var have = {}; S.rows.forEach(function (x) { if (x.id) have[x.id] = 1; });
    var add = m.filter(function (x) { return !have[x.id]; }).map(function (x) { var b = blankRow(); b.id = x.id; b.q = x.q; b.f = label(itemOf(x.id)); return b; });
    S.rows = S.rows.filter(function (x) { return x.id || x.q; }).concat(add); if (!S.rows.length) S.rows = [blankRow()];
    S.doc = { b64: r.pdf, thumbs: r.thumbs, text: r.text, n: add.length, file: r.fromPdf ? r.fileName : '', err: r.ocrError || '' };
    toast(r.ocrError ? 'อ่านข้อความไม่สำเร็จ · แนบ PDF แล้ว เลือกสินค้าเองได้' : add.length ? 'จับคู่สินค้าได้ ' + add.length + ' รายการ · ตรวจจำนวนก่อนส่ง' : 'แนบเอกสารแล้ว · ไม่พบชื่อสินค้าที่ตรงกัน เลือกเองได้', !r.ocrError);
    draw();
  };
  $('bChk').onclick = async function () {
    try { busy(true, 'กำลังตรวจ...'); var r = await api('ioPubIStockStatus', [$('fNo').value]); var st = { pending: 'รออนุมัติ', approved: 'อนุมัติแล้ว', rejected: 'ไม่อนุมัติ' }[r.status] || r.status; $('stOut').innerHTML = '<b>' + esc(r.no) + '</b> · ' + st + (r.reason ? ' · ' + esc(r.reason) : '') + (r.decAt ? ' · ' + esc(r.decAt.slice(0, 16)) : ''); }
    catch (e) { $('stOut').textContent = e.message; } finally { busy(false); }
  };
  $('bGo').onclick = async function () {
    keep();
    var items = [], bad = '';
    S.rows.forEach(function (r, i) {
      var q = Math.floor(Number(r.q) || 0);
      if (!r.id && !q) return;
      if (!r.id) { bad = bad || 'รายการที่ ' + (i + 1) + ': ' + (r.f ? 'เลือกสินค้าจากรายการที่ขึ้นมา' : 'เลือกสินค้า'); return; }
      if (!(q > 0)) { bad = bad || 'รายการที่ ' + (i + 1) + ': ใส่จำนวน'; return; }
      if (r.id === NEW) { var n = r.n; if (!n || !n.name) { bad = bad || 'รายการที่ ' + (i + 1) + ': กดแก้ไขข้อมูลแล้วกรอกข้อมูลสินค้าใหม่'; return; } items.push({ new: 1, sku: n.sku, name: n.name, unit: n.unit, cat: n.cat, catName: n.catName || '', brand: n.brand, pack: n.pack, subpack: n.subpack, weight: n.weight, cost: n.cost, extra: n.extra, photo: n.photo ? { b64: n.photo.b64, thumb: n.photo.thumb } : null, q: q }); }
      else items.push({ id: r.id, q: q });
    });
    if (bad) { toast(bad); return; }
    if (!items.length) { toast('เลือกสินค้าและใส่จำนวนอย่างน้อย 1 รายการ'); return; }
    if (S.name.trim().length < 3) { toast('ใส่ชื่อ - นามสกุล'); $('fName').focus(); return; }
    if (!S.dept.trim()) { toast('ใส่หน่วยงาน'); $('fDept').focus(); return; }
    $('bGo').disabled = true;
    try {
      busy(true, 'กำลังส่งคำขอ' + (S.photo || S.doc ? 'และอัปโหลดไฟล์' : '') + '...');
      var r = await api('ioPubIStockReq', [{ dev: reqDev(), kind: S.kind, src: S.src, t: S.t, d: S.d, items: items, name: S.name, dept: S.dept, phone: S.tel, note: S.note, ocr: S.doc ? S.doc.text : '' }, S.photo, S.doc ? { b64: S.doc.b64 } : null]);
      window.scrollTo(0, 0); $('app').className = '';
      $('app').innerHTML = '<div class="card ok" style="max-width:560px;margin:20px auto"><div class="big" style="color:var(--ok)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></div><h2>ส่งคำขอแล้ว (' + items.length + ' รายการ)</h2><div class="hint">เลขคำขอ</div><div class="no">' + esc(r.no) + '</div><p class="hint">จดเลขนี้ไว้ตรวจสถานะ · เจ้าหน้าที่ของคลังที่เลือกจะตรวจและอนุมัติ</p><button id="bNew">ส่งคำขอใหม่</button></div>';
      $('bNew').onclick = function () { S.rows = [blankRow()]; S.photo = null; S.doc = null; S.note = ''; draw(); };
    } catch (e) { toast(e.message); if ($('bGo')) $('bGo').disabled = false; } finally { busy(false); }
  };
}
(async function () {
  try { var mt = await api('ioPubIStockMeta', []).catch(function () { return null; }); if (mt && mt.cats) { META = mt; CATS = mt.cats.concat([['other', 'อื่นๆ (ยังไม่ระบุหมวด)']]); } } catch (e) { }
  try { S.items = await api('ioPubIStockItems', []); S.items.forEach(function (x) { if (x.cat === 'fb') x.cat = 'FNB'; else if (x.cat === 'mer') x.cat = 'MER'; }); draw(); }
  catch (e) { $('app').innerHTML = '<div class="card"><b>เปิดแบบฟอร์มไม่ได้</b><p class="hint">' + esc(/ไม่อนุญาต|ไม่พบฟังก์ชัน/.test(e.message) ? 'ระบบยังไม่พร้อม (ต้องอัปเดต Apps Script)' : e.message) + '</p><button onclick="location.reload()">ลองใหม่</button></div>'; }
})();
</script>
</body>
</html>
