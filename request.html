<!DOCTYPE html>
<html lang="th">

<meta name="theme-color" content="#8a6d2f">
<title>เบิกสินค้า Nok Air</title>
<style>

.go { width: 100%; padding: 14px; font-size: 17px; margin-top: 4px; }
.hint { color: var(--mut); font-size: 13px; }

details summary { cursor: pointer; font-weight: 700; color: var(--gold2); }
.st { margin-top: 8px; font-size: 14px; }

button.sm { padding: 5px 10px; font-size: 13px; } button.add { width: 100%; margin-top: 2px; }
.card h2 small { font-weight: 400; }

<body>
<header><span class="ico">📦</span><h1>เบิกสินค้า Nok Air</h1><p>แบบฟอร์มคำขอเบิก / รับเข้าสินค้า · เจ้าหน้าที่ Inflight จะตรวจและอนุมัติ</p></header>

<script>

  // ทำให้ตัวหนังสือชัด (ขาวดำ + ยืดความต่างสี)

    var o = document.createElement('canvas'); o.width = c.width; o.height = c.height;
    var g = o.getContext('2d'); g.drawImage(c, 0, 0);

    for (i = 0; i < p.length; i += 4) { var l = Math.round(p[i] * .299 + p[i + 1] * .587 + p[i + 2] * .114); p[i] = l; hist[l]++; }

  function jpg(c, q) { return c.toDataURL('image/jpeg', q || .82); }
  function loadJsPdf() {
    if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);

  }
  // รวมหน้าเป็น PDF (A4 · รูปพอดีหน้า)
  function toPdf(pages) {
    return loadJsPdf().then(function (J) {
      var doc = null;
      return Promise.all(pages.map(function (p) { return loadImg(p.out); })).then(function (ims) {

  // หามุมกระดาษอัตโนมัติ (กระดาษสีอ่อนบนพื้นเข้ม): Otsu threshold แล้วหาจุดสุดขอบ 4 ทิศ

  // หน้าตัดขอบ: ลากมุมทั้ง 4
  function editor(pg) {

    var r = await DocScan.open({ title: 'สแกนเอกสาร', max: 5, okText: 'เสร็จ · อ่านข้อความ', hint: 'ถ่ายได้หลายหน้า · รวมเป็น PDF ไฟล์เดียว', ocr: function (pages) { return api('ioPubOcr', [pages.slice(0, 2)]); } });
    if (!r) return;
    var L = S.items.filter(function (x) { return x.kind === S.kind; }), m = DocScan.matchItems(r.text, L);
    // เติมรายการที่จับคู่ได้ (ไม่ซ้ำกับที่เลือกไว้แล้ว)
    var have = {}; S.rows.forEach(function (x) { if (x.id) have[x.id] = 1; });
    var add = m.filter(function (x) { return !have[x.id]; }).map(function (x) { var b = blankRow(); b.id = x.id; b.q = x.q; return b; });
    S.rows = S.rows.filter(function (x) { return x.id || x.q; }).concat(add); if (!S.rows.length) S.rows = [blankRow()];
    S.doc = { b64: r.pdf, thumbs: r.thumbs, text: r.text, n: add.length };
    if (!S.photo && r.pages.length) S.photo = { mime: 'image/jpeg', b64: r.pages[0].split(',')[1], thumb: r.thumbs[0] };
    toast(r.ocrError ? 'อ่านข้อความไม่สำเร็จ · แนบ PDF แล้ว เลือกสินค้าเองได้' : add.length ? 'จับคู่สินค้าได้ ' + add.length + ' รายการ · ตรวจจำนวนก่อนส่ง' : 'แนบเอกสารแล้ว · ไม่พบชื่อสินค้าที่ตรงกัน เลือกเองได้', !r.ocrError);
    draw();
  };
  $('bChk').onclick = async function () {
    try { busy(true, 'กำลังตรวจ...'); var r = await api('ioPubIStockStatus', [$('fNo').value]); var st = { pending: '⏳ รออนุมัติ', approved: '✅ อนุมัติแล้ว', rejected: '❌ ไม่อนุมัติ' }[r.status] || r.status; $('stOut').innerHTML = '<b>' + esc(r.no) + '</b> · ' + st + (r.reason ? ' · ' + esc(r.reason) : '') + (r.decAt ? ' · ' + esc(r.decAt.slice(0, 16)) : ''); }
    catch (e) { $('stOut').textContent = e.message; } finally { busy(false); }
  };
  $('bGo').onclick = async function () {
    keep();
    var items = [], bad = '';
    S.rows.forEach(function (r, i) {
      var q = Math.floor(Number(r.q) || 0);
      if (!r.id && !q) return;
      if (!r.id) { bad = bad || 'รายการที่ ' + (i + 1) + ': เลือกสินค้า'; return; }
      if (!(q > 0)) { bad = bad || 'รายการที่ ' + (i + 1) + ': ใส่จำนวน'; return; }
      if (r.id === NEW) { if (!String(r.name).trim()) { bad = bad || 'รายการที่ ' + (i + 1) + ': ใส่ชื่อสินค้าใหม่'; return; } var cat = r.cat === '__other' ? String(r.catx || '').trim() : r.cat; if (!cat) { bad = bad || 'รายการที่ ' + (i + 1) + ': ใส่ชื่อหมวดใหม่'; return; } items.push({ new: 1, sku: r.sku, name: r.name, unit: r.unit, cat: cat, q: q }); }
      else items.push({ id: r.id, q: q });
    });
    if (bad) { toast(bad); return; }
    if (!items.length) { toast('เลือกสินค้าและใส่จำนวนอย่างน้อย 1 รายการ'); return; }
    if (S.name.trim().length < 3) { toast('ใส่ชื่อ - นามสกุล'); $('fName').focus(); return; }
    if (!S.dept.trim()) { toast('ใส่หน่วยงาน'); $('fDept').focus(); return; }
    if (!S.photo) { toast('ต้องแนบรูปหรือถ่ายรูปก่อนส่ง'); return; }
    $('bGo').disabled = true;
    try {
      busy(true, 'กำลังส่งคำขอและอัปโหลดรูป...');
      var r = await api('ioPubIStockReq', [{ kind: S.kind, t: S.t, d: S.d, items: items, name: S.name, dept: S.dept, phone: S.tel, note: S.note, ocr: S.doc ? S.doc.text : '' }, S.photo, S.doc ? { b64: S.doc.b64 } : null]);
      window.scrollTo(0, 0);
      $('app').innerHTML = '<div class="card ok"><div class="big">✅</div><h2>ส่งคำขอแล้ว (' + items.length + ' รายการ)</h2><div class="hint">เลขคำขอ</div><div class="no">' + esc(r.no) + '</div><p class="hint">จดเลขนี้ไว้ตรวจสถานะ · เจ้าหน้าที่ Inflight จะตรวจและอนุมัติ</p><button id="bNew">ส่งคำขอใหม่</button></div>';
      $('bNew').onclick = function () { S.rows = [blankRow()]; S.photo = null; S.doc = null; S.note = ''; draw(); };
    } catch (e) { toast(e.message); if ($('bGo')) $('bGo').disabled = false; } finally { busy(false); }
  };
}
(async function () {
  try { S.items = await api('ioPubIStockItems', []); draw(); }
  catch (e) { $('app').innerHTML = '<div class="card"><b>เปิดแบบฟอร์มไม่ได้</b><p class="hint">' + esc(/ไม่อนุญาต|ไม่พบฟังก์ชัน/.test(e.message) ? 'ระบบยังไม่พร้อม (ต้องอัปเดต Apps Script)' : e.message) + '</p><button onclick="location.reload()">ลองใหม่</button></div>'; }
})();
</script>
