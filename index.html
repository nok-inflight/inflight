function twoClick(btn, fn, label) {
  btn.onclick = () => {
    if (!btn.dataset.c) { btn.dataset.c = '1'; btn.textContent = 'กดอีกครั้งเพื่อยืนยัน'; setTimeout(() => { if (btn.isConnected) { delete btn.dataset.c; btn.textContent = label || 'ลบ'; } }, 4000); return; }

function newerStamp(a, b) {
  if (!a) return b; if (!b) return a;
  const n = a.at > b.at ? a : b;
  return { at: n.at, by: n.by, count: (a.count || 0) + (b.count || 0) };
}

function loadScript(src) {
  return new Promise((ok, ko) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ko(new Error('โหลดไม่สำเร็จ')); document.head.appendChild(s); });
}
async function readSheetFile(file) {
  const name = file.name.toLowerCase();
  if (/\.csv$/.test(name)) {
    const text = await file.text();
    return text.split(/\r?\n/).map(l => l.indexOf('\t') >= 0 ? l.split('\t') : l.split(',').map(x => x.replace(/^"|"$/g, '')));
  }
  const buf = await file.arrayBuffer();
  try {
    if (typeof XLSX === 'undefined') await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(buf, { type: 'array' });
    return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' });
  } catch (e) {
    if (/\.xls$/.test(name) || typeof ExcelJS === 'undefined') throw e;
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buf);
    const out = [];
    wb.worksheets[0].eachRow(row => { out.push(row.values.slice(1).map(v => v && typeof v === 'object' ? (v.text || v.result || '') : v)); });
    return out;
  }
}

function updateStock() {
  if (!$('stkNote')) return;
  const num = f => Number(String(f || '').replace(/\D/g, '')) || 0;
  const cur = num($('Flight').value), me = $('EntryId').value;
  const before = {};
  (STOCK.flights || []).forEach(f => {
    if (f.id === me) return;
    if (cur && num(f.flight) >= cur) return;
    Object.keys(f.items || {}).forEach(n => { before[n] = (before[n] || 0) + f.items[n]; });
  });
  each('.tile', t => {
    const it = SALECAT[t.dataset.k], s = SOLD[t.dataset.k] || 0;
    const base = STOCK.loaded ? STOCK.loaded[it.name] : undefined;
    const L = STOCK.has && base !== undefined ? base - (before[it.name] || 0) : null;
    t.querySelector('.sL').textContent = L === null ? '-' : L;
    t.querySelector('.sS').textContent = s;
    const r = t.querySelector('.sR');
    r.textContent = L === null ? '-' : L - s;
    r.className = 'sR' + (L !== null && L - s < 0 ? ' neg' : '');
  });
  const d = $('Date').value;
  $('stkNote').textContent = !d ? '' : STOCK.has
    ? 'LOADED = ของบนรถตอนเริ่มเที่ยวนี้ (จาก BAC วันที่ ' + d + ') · RETURN = LOADED − SOLD'
    : 'BAC ยังไม่ได้กรอก LOADED ของวันที่ ' + d;
}

function updateTiles() {
  let fb = 0, mer = 0, any = false;
  each('.tile', t => {
    const q = SOLD[t.dataset.k] || 0, it = SALECAT[t.dataset.k];
    t.classList.toggle('on', q > 0);
    t.querySelector('.qb').textContent = '\u00d7' + q;
    if (q > 0) { any = true; if (it.cat === 'MERCHANDISE') mer += it.price * q; else fb += it.price * q; }
  });
  const sb = $('SnackBev'), mr = $('Merch');
  if (any) {
    if (!sb.dataset.auto) { sb.dataset.mf = sb.value; mr.dataset.mf = mr.value; sb.dataset.auto = '1'; }
    sb.value = fb || ''; mr.value = mer || '';
    sb.readOnly = mr.readOnly = true; sb.classList.add('auto'); mr.classList.add('auto');
  } else if (sb.dataset.auto) {
    sb.value = sb.dataset.mf; mr.value = mr.dataset.mf; delete sb.dataset.auto;
    sb.readOnly = mr.readOnly = false; sb.classList.remove('auto'); mr.classList.remove('auto');
  }
  $('tFB').textContent = money(fb); $('tMER').textContent = money(mer); $('tAll').textContent = money(fb + mer);
  updateStock();
  recalc();
}

function recalcBac() {
  const sold = BAC_DATA ? BAC_DATA.sold : {};
  const sum = { fb: [0, 0, 0, 0], mer: [0, 0, 0, 0] };
  each('#vSum .ld', el => {
    const tds = el.closest('tr').children;
    const ld = el.value === '' ? null : Number(el.value) || 0;
    const s = Number(sold[el.dataset.item]) || 0, price = Number(el.dataset.price) || 0;
    const g = el.dataset.cat === 'MERCHANDISE' ? sum.mer : sum.fb;
    tds[3].textContent = s || '';
    tds[5].textContent = s ? money(s * price) : '';
    if (ld !== null || s) {
      const r = (ld || 0) - s;
      tds[4].textContent = r;
      tds[4].className = 'r ro' + (r < 0 ? ' neg' : '');
      g[2] += r;
    } else { tds[4].textContent = ''; tds[4].className = 'r ro'; }
    g[0] += ld || 0; g[1] += s; g[3] += s * price;
  });
  const put = (id, a) => {
    const tds = $(id).children;
    tds[2].textContent = a[0]; tds[3].textContent = a[1]; tds[4].textContent = a[2]; tds[5].textContent = money(a[3]);
  };
  put('subFB', sum.fb); put('subMer', sum.mer);
  put('subAll', sum.fb.map((x, i) => x + sum.mer[i]));
}

const MONTHS_EN = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];

async function getReport(m) {
    const d = await run('commissionReport', m);
    let ents = null;
    try {
      const last = new Date(Number(m.slice(0, 4)), Number(m.slice(5, 7)), 0).getDate();
      ents = await run('listEntries', m + '-01', m + '-' + String(last).padStart(2, '0'), '');
    } catch (x) { ents = null; }

    const nv = x => Number(x) || 0;
    const sumOf = list => list.reduce((a, r) => ({ fb: a.fb + nv(r.fb), mer: a.mer + nv(r.mer), total: a.total + nv(r.total) }), { fb: 0, mer: 0, total: 0 });
    const normCh = r => {
      const fb = nv(r.fb != null ? r.fb : r.commFB), mer = nv(r.mer != null ? r.mer : r.commMER);
      return { flight: r.flight || r.Flight || r.no || r.staffNo || '', fb: fb, mer: mer, total: r.total != null ? nv(r.total) : fb + mer };
    };
    const isFlt = no => /^[A-Z]{2}\d{3,4}$/.test(String(no || '').trim().toUpperCase());
    let chRows = [];
    if (Array.isArray(d.charter)) chRows = d.charter;
    else if (d.charter && typeof d.charter === 'object') chRows = d.charter.rows || d.charter.list || [];
    if (!chRows.length && Array.isArray(d.charters)) chRows = d.charters;
    d.rows = d.rows || [];
    chRows = chRows.concat(d.rows.filter(r => isFlt(r.no))).map(normCh);
    d.rows = d.rows.filter(r => !isFlt(r.no));
    const fltNo = f => { f = String(f || '').trim().toUpperCase(); return /^\d+$/.test(f) ? 'DD' + f : f; };
    if (Array.isArray(ents)) {

      const agg = {};
      ents.forEach(e => {
        const isCh = e.charter === true || String(e.charter).toUpperCase() === 'TRUE' || calcComm(e.flight, 0, 0, 0).charter;
        if (!isCh) return;
        const k = fltNo(e.flight);
        const o = agg[k] || (agg[k] = { fb: 0, mer: 0 });
        o.fb += nv(e.fb); o.mer += nv(e.mer);
      });
      chRows = Object.keys(agg).map(k => {
        const fb = agg[k].fb * RATE.fb, mer = agg[k].mer * RATE.mer;
        return { flight: k, fb: fb, mer: mer, total: fb + mer };
      });
    }
    const byF = {};
    chRows.forEach(r => {
      const k = fltNo(r.flight);
      const o = byF[k] || (byF[k] = { flight: k, fb: 0, mer: 0, total: 0 });
      o.fb += r.fb; o.mer += r.mer; o.total += r.total;
    });
    const chList = (CHARTER && CHARTER.length ? CHARTER : CHARTER_DEFAULT)
      .map(f => fltNo(f && typeof f === 'object' ? (f.flight || f.Flight || f.no) : f)).filter(x => x);
    chList.forEach(f => { if (!byF[f]) byF[f] = { flight: f, fb: 0, mer: 0, total: 0 }; });
    chRows = Object.keys(byF).sort().map(k => byF[k]);
    d.totals = sumOf(d.rows);
    d.charter = { rows: chRows, totals: sumOf(chRows) };
    d.all = d.totals.total + d.charter.totals.total;
    if (!d.title) d.title = 'SALE ON BOARD SUMMARY FOR COMMISSION ' + MONTHS_EN[Number(m.slice(5, 7)) - 1] + ', ' + m.slice(0, 4);
    return d;
}

function xlPut(ws, r, c, v, st) {

  if (st) cell.style = st;
  return cell;
}

  const label = f => { const s = String(f || '').toUpperCase().replace(/^DD/, ''); return /^\d+$/.test(s) ? Number(s) : String(f || ''); };

    xlPut(ws, 6, c + 1, { formula: cm + '5*' + rate.mer, result: e ? xlR2(e.mer * rate.mer) : 0 }, S.pctV);

    }
    const crew = (e.crew || []).filter(x => x);
    if (!crew.length) return;
    crew.forEach(id => {
      if (rowOf[id] === undefined) { rowOf[id] = 7 + people.length + extra.length; extra.push({ name: 'Name not found', id: id, charter: false }); }
      add(rowOf[id], c, e.fb * rate.fb / crew.length); add(rowOf[id], c + 1, e.mer * rate.mer / crew.length);
    });
  });
  const all = people.concat(extra);
  const lastRow = 6 + all.length;
  all.forEach((p, i) => {
    const r = 7 + i;
    H(r, 21.75);
    for (let c = 1; c <= 3; c++) xlPut(ws, r, c, undefined, S.wN);
    xlPut(ws, r, 4, p.name, p.charter ? S.cName : S.sName);
    xlPut(ws, r, 5, p.id, p.charter ? S.cId : S.sId);
    let tf = 0, tm = 0;
    for (let q = 0; q < NP; q++) {
      const c = 6 + q * 2;
      const a = val[r + '|' + c], b = val[r + '|' + (c + 1)];
      if (a) tf += a; if (b) tm += b;
      xlPut(ws, r, c, a ? xlR2(a) : undefined, S.vF);
      xlPut(ws, r, c + 1, b ? xlR2(b) : undefined, S.vM);
    }
    xlPut(ws, r, TV, { formula: sumifRow(r, 'F&B'), result: xlR2(tf) }, S.tVal);
    xlPut(ws, r, TV + 1, { formula: sumifRow(r, 'MER'), result: xlR2(tm) }, S.tVal);
  });

  const tr = lastRow + 1;
  H(tr, 15.75);
  xlPut(ws, tr, 4, undefined, xlSt({ font: xlFont({ bold: false }), fill: C.WHITE, align: { horizontal: 'right' }, fmt: XL_ACC }));
  xlPut(ws, tr, 5, 'Total', S.totLab);
  let gF = 0, gM = 0;
  Object.keys(val).forEach(k => { const c = Number(k.split('|')[1]); if ((c - 6) % 2 === 0) gF += val[k]; else gM += val[k]; });
  for (let c = 6; c < TV; c++) {
    let s = 0; Object.keys(val).forEach(k => { if (Number(k.split('|')[1]) === c) s += val[k]; });
    xlPut(ws, tr, c, { formula: 'SUM(' + col(c) + '7:' + col(c) + lastRow + ')', result: xlR2(s) }, S.totV);
  }
  xlPut(ws, tr, TV, { formula: 'SUM(' + TVc + '7:' + TVc + lastRow + ')', result: xlR2(gF) }, S.totT);
  xlPut(ws, tr, TV + 1, { formula: 'SUM(' + TWc + '7:' + TWc + lastRow + ')', result: xlR2(gM) }, S.totT);
  const gr = tr + 1;
  H(gr, 21.75);
  xlPut(ws, gr, TV - 8, 'GRAND TOTAL', S.gL); xlPut(ws, gr, TV - 7, undefined, S.gL2);
  xlPut(ws, gr, TV, { formula: TVc + tr + '+' + TWc + tr, result: xlR2(gF + gM) }, S.gV);
  xlPut(ws, gr, TV + 1, undefined, S.gV2);
  return ws;
}

async function xlPatch(buf, JSZipLib, themeXml) {
  const zip = await JSZipLib.loadAsync(buf);
  const stPath = 'xl/styles.xml';
  let st = await zip.file(stPath).async('string');
  st = st.replace(/(<fonts[^>]*>\s*)<font>[\s\S]*?<\/font>/,
    '$1<font><sz val="11"/><color theme="1"/><name val="Tahoma"/><family val="2"/><charset val="222"/><scheme val="minor"/></font>');
  zip.file(stPath, st);
  if (themeXml && zip.file('xl/theme/theme1.xml')) zip.file('xl/theme/theme1.xml', themeXml);
  return zip.generateAsync({ type: 'uint8array', compression: 'DEFLATE' });
}

function xlBacSheet(wb, name, title, iso, items, by) {
  const MN = MONTHS_EN[Number(iso.slice(5, 7)) - 1];
  const ws = wb.addWorksheet(name, {
    properties: { defaultRowHeight: 18, defaultColWidth: 9.14 },
    pageSetup: { paperSize: 9, orientation: 'portrait', fitToPage: true, fitToWidth: 1, fitToHeight: 0 }
  });
  [58.29, 12.71, 12.71, 12.71, 12.71, 12.71, 12.57, 11.57, 9.29].forEach((w, i) => { ws.getColumn(i + 1).width = w; });
  const GOLD = 'FFFFCC00', PALE = 'FFFFFFCC', SOLD = 'FFFFFF99';
  const fnt = (sz, o) => Object.assign({ name: 'Bahnschrift SemiCondensed', size: sz, color: { argb: 'FF000000' } }, o || {});
  const fill = a => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: a } });
  const M = { style: 'medium' }, T = { style: 'thin' };
  const put = (r, c, v, o) => {
    const cell = ws.getCell(r, c);
    if (v !== undefined) cell.value = v;
    cell.font = o.font || fnt(11);
    if (o.fill) cell.fill = fill(o.fill);
    cell.alignment = { horizontal: o.h || 'center', vertical: 'middle' };
    if (o.border) cell.border = o.border;
    return cell;
  };
  for (let r = 1; r <= 70; r++) ws.getRow(r).height = 18;
  const box = { left: M, right: M, top: M, bottom: M };
  put(3, 1, title, { font: fnt(16, { bold: true, underline: true }), h: 'left' });
  put(5, 1, 'DATE ' + iso.slice(8, 10) + '  ' + MN.charAt(0) + MN.slice(1).toLowerCase() + ' ' + iso.slice(0, 4),
    { font: fnt(14, { bold: true, italic: true, underline: true }), h: 'left' });
  const header = (r, t) => {
    [t, 'CODE', 'PRICE', 'SOLD', 'TOTAL SOLD', 'AMOUNT'].forEach((x, i) => put(r, i + 1, x, { font: fnt(12, { bold: true }), fill: GOLD, border: box }));
  };
  const itemRow = (r, it, last) => {
    const bt = last ? M : T;
    put(r, 1, it ? it.name : undefined, { h: 'left', border: { left: M, right: T, top: T, bottom: bt } });
    put(r, 2, undefined, { border: { left: T, right: T, top: T, bottom: bt } });
    put(r, 3, it ? it.price : undefined, { border: { left: T, right: T, top: T, bottom: bt } });
    put(r, 4, it && it.sold ? it.sold : undefined, { fill: SOLD, border: { left: M, right: M, top: T, bottom: bt } });
    put(r, 5, it ? { formula: 'D' + r, result: it.sold } : undefined, { border: { left: T, right: T, top: T, bottom: bt } });
    put(r, 6, it ? { formula: 'C' + r + '*E' + r, result: it.price * it.sold } : undefined, { border: { left: T, right: M, top: T, bottom: bt } });
  };
  const catRow = (r, cat) => {
    for (let c = 1; c <= 6; c++) {
      put(r, c, c === 1 ? cat : undefined, { font: c === 1 ? fnt(12, { bold: true, italic: true }) : fnt(11), fill: PALE, h: c === 1 ? 'left' : 'center',
        border: { left: c === 1 ? M : undefined, right: c === 6 ? M : undefined, top: M, bottom: M } });
    }
  };
  const block = (r0, t, cats, withCat, endBlanks) => {
    header(r0, t);
    let r = r0 + 1;
    const first = r;
    cats.forEach(cat => {
      const list = items.filter(i => i.cat === cat);
      if (!list.length) return;
      if (withCat) catRow(r++, cat);
      list.forEach(i => itemRow(r++, i, false));
      if (withCat) itemRow(r++, null, false);
    });
    for (let k = 0; k < endBlanks; k++) itemRow(r++, null, k === endBlanks - 1);
    return { first: first, last: r - 1 };
  };
  const total = list => list.reduce((s, i) => s + i.price * i.sold, 0);
  const fb = items.filter(i => i.cat !== 'MERCHANDISE'), mer = items.filter(i => i.cat === 'MERCHANDISE');
  const a = block(7, 'FOOD & BEVERAGE', CAT_ORDER.slice(0, 6), true, 1);
  put(a.last, 8, { formula: 'SUM(F' + a.first + ':F' + a.last + ')', result: total(fb) }, { font: fnt(12, { bold: true }), border: box });
  const b = block(a.last + 2, 'MERCHANDISE', ['MERCHANDISE'], false, 3);
  put(b.last, 8, { formula: 'SUM(F' + b.first + ':F' + b.last + ')', result: total(mer) }, { font: fnt(12, { bold: true }), border: box });
  const gt = b.last + 2;
  put(gt, 6, undefined, { fill: GOLD, border: { right: M, top: M, bottom: M } });
  put(gt, 5, 'GRAND TOTAL', { font: fnt(12, { bold: true }), fill: GOLD, border: { left: M, top: M, bottom: M } });
  ws.mergeCells(gt, 5, gt, 6);
  put(gt, 8, { formula: 'H' + a.last + '+H' + b.last, result: total(items) }, { font: fnt(12, { bold: true }), fill: GOLD, border: box });
  put(gt + 2, 1, 'PREPARED BY : ' + by, { font: fnt(10, { bold: true }), h: 'left' });
  if (name.indexOf("'") < 0) ws.pageSetup.printArea = 'A$1:I$' + (gt + 2);
  return ws;
}

async function exportBacDay(iso) {
  try {
    if (typeof ExcelJS === 'undefined') { toast('โหลดตัวสร้าง Excel ไม่สำเร็จ ลองรีเฟรชหน้าเว็บ'); return; }
    let fl;
    try { fl = await run('ioDaySold', iso); }
    catch (x) { toast(/ioDaySold/.test(x.message) ? 'ยังไม่ได้อัปเดตไฟล์ Inflight_Addon ใน Apps Script' : x.message); return; }
    if (!fl.length) { toast('ยังไม่มีใบขายที่ลูกเรือลงข้อมูลของวันที่ ' + iso); return; }
    const itemsOf = m => SALECAT.map(it => ({ name: it.name, cat: it.cat, price: it.price, sold: Number(m[it.name]) || 0 }));
    const sum = {};
    fl.forEach(f => Object.keys(f.items).forEach(k => { sum[k] = (sum[k] || 0) + f.items[k]; }));
    const by = String(ME.name || '').toUpperCase();
    const MN = MONTHS_EN[Number(iso.slice(5, 7)) - 1];
    const wb = new ExcelJS.Workbook();
    xlBacSheet(wb, 'Summary ( ' + iso.slice(8, 10) + ' ' + MN.charAt(0) + MN.slice(1, 3).toLowerCase() + "'" + iso.slice(2, 4) + ')', 'SALES ON BOARD REVENUE', iso, itemsOf(sum), by);
    const used = {}, noItems = [];
    fl.forEach(f => {
      let n = String(f.flight || '').toUpperCase().replace(/^DD/, '').replace(/[^0-9A-Za-z_ -]/g, '').slice(0, 28) || 'Flight';
      if (used[n]) { used[n]++; n = n + ' (' + used[n] + ')'; } else used[n] = 1;
      if (!Object.keys(f.items).length) noItems.push(f.flight);
      xlBacSheet(wb, n, 'DAILY INFLIGHT SALES REPORT', iso, itemsOf(f.items), by);
    });
    const buf = await wb.xlsx.writeBuffer();
    const url = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Daily_Sales_' + iso + '.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(noItems.length ? 'ดาวน์โหลดแล้ว · เที่ยวบิน ' + noItems.join(', ') + ' ลูกเรือไม่ได้กดรายการสินค้า ยอดในชีทจึงเป็น 0' : 'ดาวน์โหลดแล้ว', !noItems.length);
  } catch (e) { toast(e.message); }
}

        const chList = d.charter.rows.map(r => r.flight);
        const isCh = e => e.charter === true || calcComm(e.flight, 0, 0, 0).charter;
        for (let i = 1; i <= days; i++) {
          const ds = m + '-' + String(i).padStart(2, '0');
          xlDay(wb, i, month.filter(e => e.date === ds), d.rows, chList, RATE, isCh);
          if (i % 5 === 0) await new Promise(r => setTimeout(r, 0));
        }
      }
      out = await wb.xlsx.writeBuffer();
      if (typeof JSZip !== 'undefined') { try { out = await xlPatch(out, JSZip, XL_THEME); } catch (x) {  } }
    } finally { busy(false); }
    const url = URL.createObjectURL(new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    const a = document.createElement('a');
    a.href = url;
    a.download = m.slice(5, 7) + '_Crew_Commission_Monthly_' + m.slice(0, 4) + '.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(month ? 'ดาวน์โหลดแล้ว' : 'ดาวน์โหลดแล้ว (ไม่มีชีทรายวัน: ยังไม่ได้เพิ่ม Inflight_Addon.gs)', !!month);
  } catch (e) { busy(false); toast(e.message); }
}

$('bLogin').onclick = doLogin;
$('bSet').onclick = showSettings;
$('bBell').onclick = showBell;
$('lp').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
$('lu').onkeydown = e => { if (e.key === 'Enter') $('lp').focus(); };
$('bOut').onclick = async () => {
  try { await call_('logout', [TOKEN]); } catch (e) {}
  showLogin();
};
(async function init() {
  const tk = load_('tk');
  if (tk) {
    try { enterApp(await call_('me', [tk])); return; } catch (e) { store_('tk', null); }
  }
  showLogin();
})();
</script>
