.lang { position: absolute; right: 12px; bottom: 10px; background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.6); color: #fff; border-radius: 14px; padding: 3px 10px; font-size: 12px; }
nav { display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; position: sticky; top: 0; background: var(--bg); z-index: 5; border-bottom: 1px solid var(--line); scrollbar-width: none; } nav::-webkit-scrollbar { display: none; }
